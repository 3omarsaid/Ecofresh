</div>

<div class="grid grid-cols-1 md:grid-cols-2 gap-x-gutter gap-y-6">
<!-- Name -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface" for="contractorName">اسم المقاول <span class="text-error">*</span></label>
<input class="w-full rounded border border-outline-variant bg-surface px-4 py-2 font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary placeholder-on-surface-variant/50 transition-shadow" id="contractorName" placeholder="أدخل اسم المقاول" type="text"/>
</div>
<!-- Station -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface" for="stationSelect">المحطة التابع لها <span class="text-error">*</span></label>
<div class="relative">
<select class="w-full appearance-none rounded border border-outline-variant bg-surface px-4 py-2 font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-shadow" id="stationSelect">
<option disabled="" selected="" value="">اختر المحطة</option>
<option value="1">محطة الإسكندرية المركزية</option>
<option value="2">محطة القاهرة للحاويات</option>
<option value="3">محطة بورسعيد</option>
</select>
<div class="pointer-events-none absolute inset-y-0 left-0 flex items-center px-4 text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]" data-icon="expand_more">expand_more</span>
</div>
</div>
</div>

<label class="font-label-sm text-label-sm text-on-surface" for="contractorPhone">الهاتف</label>
<div class="relative">
<input class="w-full rounded border border-outline-variant bg-surface px-4 py-2 pr-10 font-data-tabular text-data-tabular text-left text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary placeholder-on-surface-variant/50 transition-shadow" dir="ltr" id="contractorPhone" placeholder="01X XXXX XXXX" type="tel"/>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]" data-icon="phone">phone</span>
</div>
</div>
</div>
</div>
</div>

<div class="flex flex-col gap-2">

<div class="pointer-events-none absolute inset-y-0 left-0 flex items-center px-4 text-on-surface-variant font-label-sm text-label-sm bg-surface-container-high border-r border-outline-variant rounded-l">
                                        EGP
                                    </div>
</div>
</div>

<select class="w-full appearance-none rounded border border-outline-variant bg-surface px-4 py-2 font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-shadow" id="unitSelect">
<option disabled="" selected="" value="">اختر الوحدة</option>

<option value="container">حاوية</option>
<option value="trip">نقلة</option>
<option value="day">يوم</option>
</select>

<span class="material-symbols-outlined text-[20px]" data-icon="expand_more">expand_more</span>
</div>
</div>
</div>
</div>
</div>
