<!DOCTYPE html>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

            font-variation-settings: 'FILL' 1;

        input:focus, select:focus, textarea:focus {
            outline: none;
            box-shadow: 0 0 0 2px #012d1d40;
            border-color: #012d1d;
        }

        /* Checkbox custom style */
        input[type="checkbox"]:checked {
            background-color: #012d1d;
            border-color: #012d1d;
        }

<link rel="stylesheet" href="../css/global.css" />
<link rel="stylesheet" href="../css/custom.css" />
<script src="../js/navigation.js" defer></script>
<script src="../js/interactions.js" defer></script>
<script src="../js/app.js" defer></script>
</head>
<body class="bg-background text-on-surface min-h-screen w-full flex flex-col font-['IBM_Plex_Sans_Arabic'] antialiased overflow-x-hidden">
<!-- App Layout Container -->
<div class="flex h-screen overflow-hidden">
<!-- Main Content Area -->
<main class="flex-1 w-full md:w-[calc(100%-260px)] md:mr-[260px] pt-16 min-h-screen flex flex-col p-4 md:p-6 space-y-6 overflow-x-hidden box-border">
<!-- TopNavBar -->
<!-- Scrollable Content Canvas -->
<div class="flex-1 overflow-y-auto mt-16 p-container-padding bg-surface">
<!-- Page Header -->
<div class="mb-8">
<h1 class="font-display-lg text-display-lg text-on-surface mb-2">إضافة منتج جديد</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">أدخل البيانات الأساسية للمنتج وتصنيفه في النظام.</p>
</div>
<!-- Form Card -->
<div class="max-w-4xl mx-auto bg-surface-container-lowest border border-outline-variant rounded shadow-sm">
<div class="p-8">
<form class="space-y-6" id="addProductForm">
<!-- Grid Layout for Fields -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter">
<!-- Product Name -->
<div class="col-span-1 md:col-span-2">
<label class="block font-label-sm text-label-sm text-on-surface mb-2 text-right" for="productName">اسم المنتج <span class="text-error">*</span></label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded px-3 py-2 text-on-surface font-body-md text-body-md placeholder-on-surface-variant/50 focus:ring-0 transition-shadow" id="productName" name="productName" placeholder="أدخل اسم المنتج (مثال: فراولة، مانجو)" required="" type="text"/>
</div>
<!-- Size / Grade -->
<div class="col-span-1">
<label class="block font-label-sm text-label-sm text-on-surface mb-2 text-right" for="productSize">الحجم / الدرجة</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded px-3 py-2 text-on-surface font-body-md text-body-md placeholder-on-surface-variant/50 focus:ring-0 transition-shadow" id="productSize" name="productSize" placeholder="مثال: 25/30" type="text"/>
</div>
<!-- Unit -->
<div class="col-span-1">
<label class="block font-label-sm text-label-sm text-on-surface mb-2 text-right" for="productUnit">الوحدة <span class="text-error">*</span></label>
<div class="relative">
<select class="w-full bg-surface-container-lowest border border-outline-variant rounded px-3 py-2 text-on-surface font-body-md text-body-md appearance-none focus:ring-0 transition-shadow pr-3 pl-8" id="productUnit" name="productUnit" required="">
<option disabled="" selected="" value="">اختر الوحدة</option>
<option value="kg">كيلوجرام (KG)</option>
<option value="ton">طن (Ton)</option>
<option value="box">صندوق (Box)</option>
</select>
<div class="pointer-events-none absolute inset-y-0 left-0 flex items-center px-2 text-on-surface-variant">
<span class="material-symbols-outlined text-lg">expand_more</span>
</div>
</div>
</div>
<!-- Status -->
<div class="col-span-1 md:col-span-2 mt-2">
<label class="flex items-center space-x-reverse space-x-3 cursor-pointer p-3 border border-outline-variant rounded bg-surface hover:bg-surface-container-low transition-colors w-max">
<input checked="" class="form-checkbox h-5 w-5 text-primary rounded border-outline-variant" id="productStatus" name="productStatus" type="checkbox"/>
<div class="flex flex-col">
<span class="font-label-sm text-label-sm text-on-surface">حالة المنتج</span>
<span class="font-body-md text-[11px] text-on-surface-variant" id="statusLabel">نشط</span>
</div>
</label>
</div>
<!-- Notes -->
<div class="col-span-1 md:col-span-2">
<label class="block font-label-sm text-label-sm text-on-surface mb-2 text-right" for="productNotes">ملاحظات</label>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded px-3 py-2 text-on-surface font-body-md text-body-md placeholder-on-surface-variant/50 focus:ring-0 transition-shadow resize-y" id="productNotes" name="productNotes" placeholder="أي تفاصيل إضافية حول المنتج..." rows="4"></textarea>
</div>
</div>
</form>
</div>
<!-- Bottom Action Bar -->
<div class="bg-surface-container-lowest border-t border-outline-variant p-4 flex flex-col sm:flex-row justify-end items-center space-y-3 sm:space-y-0 sm:space-x-reverse sm:space-x-4 rounded-b">
<button class="w-full sm:w-auto px-6 py-2 border border-outline text-on-surface rounded font-label-sm text-label-sm hover:bg-surface-container transition-colors" type="button">
                            إلغاء
                        </button></a>
<button class="w-full sm:w-auto px-6 py-2 border border-primary text-primary bg-surface-container-lowest rounded font-label-sm text-label-sm hover:bg-primary-container hover:text-on-primary-container transition-colors" type="button">
                            حفظ كمسودة
                        </button>
<button class="w-full sm:w-auto px-6 py-2 bg-primary text-on-primary rounded font-label-sm text-label-sm hover:bg-surface-tint transition-colors shadow-sm" form="addProductForm" type="submit">
                            حفظ المنتج
                        </button>
</div>
</div>
</div>
</main>
<!-- SideNavBar (RTL Desktop Permanent, Mobile Hidden) -->
<aside id="app-sidebar" class="fixed right-0 top-0 h-full w-[260px] bg-surface border-l border-outline-variant flex flex-col z-50 overflow-y-auto shadow-md transition-transform duration-300 transform translate-x-full md:translate-x-0"></aside>
</div>
<script>
        // Simple script to toggle status label text based on checkbox
        document.addEventListener('DOMContentLoaded', () => {
            const statusCheckbox = document.getElementById('productStatus');
            const statusLabel = document.getElementById('statusLabel');

            if(statusCheckbox && statusLabel) {
                statusCheckbox.addEventListener('change', (e) => {
                    statusLabel.textContent = e.target.checked ? 'نشط' : 'غير نشط';
                });
            }
        });
    </script>
</body></html>
